<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Actor Empire 2.0</title>
    <style>
        :root {
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(20, 20, 23, 0.6);
            --bottom-nav-clearance: 5.75rem;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background-color: #050505;
        }
        body {
            font-family: 'Archivo', system-ui, sans-serif;
        }
        /* Custom Utilities */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pb-safe-lg {
            padding-bottom: calc(env(safe-area-inset-bottom) + 1rem);
        }
        .pb-safe-xl {
            padding-bottom: calc(env(safe-area-inset-bottom) + 7rem);
        }
        .pb-nav-safe {
            padding-bottom: var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance)));
        }
        .pb-nav-safe-lg {
            padding-bottom: calc(var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance))) + 2rem);
        }
        .bottom-nav-safe {
            bottom: var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance)));
        }
        .pt-safe-top {
            padding-top: max(35px, env(safe-area-inset-top));
        }
        .glass-card {
            background: rgba(20, 20, 23, 0.86);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
        }

        /* Android WebView can corrupt layers when many blurred panels are stacked.
           Keep the look, but use cheaper solid glass on touch devices. */
      @media (pointer: coarse) {
        .glass-card,
        [class*="backdrop-blur"] {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
            }
            .glass-card {
                background: rgba(20, 20, 23, 0.94);
            }
        [class*="blur-"] {
          filter: none !important;
        }
      }

      .smooth-mode .glass-card,
      .smooth-mode [class*="backdrop-blur"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .smooth-mode .glass-card {
        background: rgba(20, 20, 23, 0.96);
      }

      .smooth-mode [class*="blur-"] {
        filter: none !important;
      }

      .smooth-mode *,
      .smooth-mode *::before,
      .smooth-mode *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }

      .genre-lab-grid {
        contain: layout paint;
        transform: translateZ(0);
      }

      .genre-lab-card {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transform: translateZ(0);
      }

      .smooth-mode .genre-lab-card {
        background: rgba(24, 24, 27, 0.98) !important;
        box-shadow: none !important;
        transform: none !important;
      }

      .smooth-mode .genre-lab-card:active {
        transform: none !important;
      }

      .smooth-mode .genre-lab-progress {
        transition: none !important;
      }
        .pattern-diagonal-lines {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 5px,
                rgba(0, 0, 0, 0.3) 5px,
                rgba(0, 0, 0, 0.3) 10px
            );
        }
        .custom-scrollbar {
            -webkit-overflow-scrolling: touch; /* Momentum scrolling for iOS */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari and Opera */
        }

        /* This local shell is visible before the JavaScript bundle executes. */
        .ae-boot-shell {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #050505;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        .ae-boot-shell__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 46px;
        }
        .ae-boot-shell__mark {
            width: min(70vw, 326px);
            display: grid;
            place-items: center;
        }
        .ae-boot-shell__mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ae-boot-shell__label {
            margin: 0;
            color: #efe9e3;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5em;
            text-indent: .5em;
            text-transform: uppercase;
        }
        .ae-boot-shell__message {
            max-width: 280px;
            margin: -4px 24px 0;
            color: #d5d1c8;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.55;
            text-align: center;
        }
        .ae-boot-shell__retry {
            min-height: 48px;
            min-width: 180px;
            border: 0;
            border-radius: 14px;
            background: #e8b64c;
            color: #100d08;
            font: 800 13px/1 system-ui, sans-serif;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .ae-boot-shell__actions {
            width: min(280px, calc(100vw - 48px));
            display: grid;
            gap: 10px;
        }
        .ae-boot-shell__restart {
            min-height: 48px;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 14px;
            background: rgba(255, 255, 255, .04);
            color: #d5d1c8;
            font: 800 13px/1 system-ui, sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
    </style>
</head>
  <body class="bg-black text-white">
    <div id="root">
      <main class="ae-boot-shell" aria-label="Zedbury Studios is starting">
        <div class="ae-boot-shell__content">
          <div class="ae-boot-shell__mark" aria-hidden="true"><img src="/assets/zedbury-mark.svg" alt="" /></div>
          <p class="ae-boot-shell__label">Presents</p>
        </div>
      </main>
    </div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
