<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preload" href="/assets/fonts/actor-empire-special-elite-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/actor-empire-cinzel-600-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/actor-empire-covered-by-your-grace-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/assets/fonts/actor-empire-share-tech-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>Actor Empire 2.0</title>
    <style>
        :root {
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-bg: rgba(20, 20, 23, 0.6);
            --bottom-nav-clearance: 5.75rem;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background-color: #050505;
        }
        body {
            font-family: 'Archivo', system-ui, sans-serif;
        }
        /* Custom Utilities */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom);
        }
        .pb-safe-lg {
            padding-bottom: calc(env(safe-area-inset-bottom) + 1rem);
        }
        .pb-safe-xl {
            padding-bottom: calc(env(safe-area-inset-bottom) + 7rem);
        }
        .pb-nav-safe {
            padding-bottom: var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance)));
        }
        .pb-nav-safe-lg {
            padding-bottom: calc(var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance))) + 2rem);
        }
        .bottom-nav-safe {
            bottom: var(--ae-shell-nav-clearance, calc(env(safe-area-inset-bottom) + var(--bottom-nav-clearance)));
        }
        .pt-safe-top {
            padding-top: max(35px, env(safe-area-inset-top));
        }
        .glass-card {
            background: rgba(20, 20, 23, 0.86);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
        }

        /* Android WebView can corrupt layers when many blurred panels are stacked.
           Keep the look, but use cheaper solid glass on touch devices. */
      @media (pointer: coarse) {
        .glass-card,
        [class*="backdrop-blur"] {
          backdrop-filter: none !important;
          -webkit-backdrop-filter: none !important;
            }
            .glass-card {
                background: rgba(20, 20, 23, 0.94);
            }
        [class*="blur-"] {
          filter: none !important;
        }
      }

      .smooth-mode .glass-card,
      .smooth-mode [class*="backdrop-blur"] {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
      }

      .smooth-mode .glass-card {
        background: rgba(20, 20, 23, 0.96);
      }

      .smooth-mode [class*="blur-"] {
        filter: none !important;
      }

      /* U11 (2026-11-15): Smooth Mode flickered. Animations ran for 0.01 ms but kept their delays, so an element
         showed its starting frame (often hidden) for the delay and then jumped. Now duration and delay are both 0:
         every animation lands on its last frame at once, and transitions do not run. */
      .smooth-mode *,
      .smooth-mode *::before,
      .smooth-mode *::after {
        animation-duration: 0s !important;
        animation-delay: 0s !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0s !important;
        transition-delay: 0s !important;
        scroll-behavior: auto !important;
      }

      .genre-lab-grid {
        contain: layout paint;
        transform: translateZ(0);
      }

      .genre-lab-card {
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transform: translateZ(0);
      }

      .smooth-mode .genre-lab-card {
        background: rgba(24, 24, 27, 0.98) !important;
        box-shadow: none !important;
        transform: none !important;
      }

      .smooth-mode .genre-lab-card:active {
        transform: none !important;
      }

      .smooth-mode .genre-lab-progress {
        transition: none !important;
      }
        .pattern-diagonal-lines {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(0, 0, 0, 0.2),
                rgba(0, 0, 0, 0.2) 5px,
                rgba(0, 0, 0, 0.3) 5px,
                rgba(0, 0, 0, 0.3) 10px
            );
        }
        .custom-scrollbar {
            -webkit-overflow-scrolling: touch; /* Momentum scrolling for iOS */
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
        .custom-scrollbar::-webkit-scrollbar {
            display: none; /* Hide scrollbar for Chrome, Safari and Opera */
        }

        /* This local shell is visible before the JavaScript bundle executes. */
        .ae-boot-shell {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            background: #050505;
            color: #fff;
            font-family: system-ui, sans-serif;
        }
        .ae-boot-shell__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 46px;
        }
        .ae-boot-shell__mark {
            width: min(70vw, 326px);
            display: grid;
            place-items: center;
        }
        .ae-boot-shell__mark img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .ae-boot-shell__label {
            margin: 0;
            color: #efe9e3;
            /* crash fix (19 Nov 2026), FIX-PLAN item 2.3: the studio card's caption font and line
               (styles/zedbury-intro.css), so the card takes over without a visible change */
            font-family: 'Archivo', system-ui, sans-serif;
            line-height: 12px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .5em;
            text-indent: .5em;
            text-transform: uppercase;
        }
        .ae-boot-shell__message {
            max-width: 280px;
            margin: -4px 24px 0;
            color: #d5d1c8;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.55;
            text-align: center;
        }
        .ae-boot-shell__retry {
            min-height: 48px;
            min-width: 180px;
            border: 0;
            border-radius: 14px;
            background: #e8b64c;
            color: #100d08;
            font: 800 13px/1 system-ui, sans-serif;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .ae-boot-shell__actions {
            width: min(280px, calc(100vw - 48px));
            display: grid;
            gap: 10px;
        }
        .ae-boot-shell__restart {
            min-height: 48px;
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 14px;
            background: rgba(255, 255, 255, .04);
            color: #d5d1c8;
            font: 800 13px/1 system-ui, sans-serif;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
    </style>
</head>
  <body class="bg-black text-white">
    <div id="root">
      <main class="ae-boot-shell" aria-label="Zedbury Studios is starting">
        <div class="ae-boot-shell__content">
          <div class="ae-boot-shell__mark" aria-hidden="true"><img src="/assets/zedbury-mark.svg" alt="" /></div>
          <p class="ae-boot-shell__label">Presents</p>
        </div>
      </main>
    </div>
  <script>
    /* Crash fix (19 Nov 2026), qa/2026-11-19-crash-scene/FIX-PLAN.md item 1.7. The game's "still open" marker
       (services/sessionBreadcrumb.ts) starts here, before the game's code loads, so a phone that closes the game while
       that code is still loading (the first logo) is counted too, as BOOT. The previous session's marker is kept for
       the game to report (window.__aePrevSession). A hidden page is marked closed, because a phone may close a hidden
       app at any time; once the game has drawn, its own handlers take over. Also kept: how this page was loaded (a
       reload the game did not ask for is the iOS web view restarting after the phone closed it) and when.
       A classic script on purpose: it runs even where the game's own code cannot. */
    (function () {
      var KEY = 'ae.lastSession.v1';
      var mounted = function () { return document.documentElement.dataset.actorEmpireMounted === 'true'; };
      try { var kept = localStorage.getItem(KEY); window.__aePrevSession = kept ? JSON.parse(kept) : null; } catch (error) { window.__aePrevSession = null; }
      window.__aeBootAt = Date.now();
      try {
        var entry = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
        window.__aeNavType = entry && entry.type ? String(entry.type) : (performance.navigation && performance.navigation.type === 1 ? 'reload' : 'navigate');
      } catch (error) { window.__aeNavType = 'unknown'; }
      try { window.__aeSelfReload = sessionStorage.getItem('ae.selfReload') === '1'; sessionStorage.removeItem('ae.selfReload'); } catch (error) { window.__aeSelfReload = false; }
      // the game's own reloads say so first, so they are never mistaken for the web view restarting
      window.__aeMarkSelfReload = function () { try { sessionStorage.setItem('ae.selfReload', '1'); } catch (error) { /* optional */ } };
      var mark = function (live) {
        try { localStorage.setItem(KEY, JSON.stringify({ live: live, at: Date.now(), screen: 'BOOT' })); } catch (error) { /* best effort */ }
      };
      mark(document.visibilityState !== 'hidden');
      document.addEventListener('visibilitychange', function () { if (!mounted()) mark(document.visibilityState !== 'hidden'); });
      window.addEventListener('pagehide', function () { if (!mounted()) mark(false); });
    })();
  </script>
  <script>
    /* Start-up guard (black screen). Until the game draws its first screen, the boot shell above is all the player sees.
       When the game's code cannot start (an Android System WebView too old to read it, a failed load, an error before the
       first screen) or start-up runs very long, say so and offer Retry instead of a dark screen forever. A classic script
       on purpose, so it runs even where the game's module code cannot. It never reloads by itself, adds nothing to any
       tap, and leaves a note that index.tsx reports once the game is up. The Oct 15 rollback removed the earlier guard
       but kept its styles, which this uses. */
    (function () {
      var NOTE_KEY = 'actorEmpire.bootFallback.v1';
      var mounted = function () { return document.documentElement.dataset.actorEmpireMounted === 'true'; };
      var shown = false;
      var button = function (label, className, onClick) {
        var element = document.createElement('button');
        element.type = 'button';
        element.className = className;
        element.textContent = label;
        element.addEventListener('click', onClick);
        return element;
      };
      var show = function (kind) {
        if (shown || mounted()) return;
        var shell = document.querySelector('.ae-boot-shell__content');
        if (!shell) return;
        shown = true;
        try { localStorage.setItem(NOTE_KEY, JSON.stringify({ kind: kind, at: Date.now() })); } catch (error) { /* note only */ }
        var message = document.createElement('p');
        message.className = 'ae-boot-shell__message';
        message.setAttribute('role', 'status');
        message.textContent = kind === 'webview'
          ? "This phone's Android System WebView is too old for Actor Empire. Update Android System WebView and Chrome in the Play Store, then open the game again."
          : kind === 'slow'
            ? 'Starting is taking longer than usual. Your careers are safe on this phone.'
            : 'Actor Empire could not start. Your careers are safe on this phone.';
        var actions = document.createElement('div');
        actions.className = 'ae-boot-shell__actions';
        if (kind === 'webview') {
          actions.appendChild(button('Update WebView', 'ae-boot-shell__retry', function () {
            window.location.href = 'market://details?id=com.google.android.webview';
          }));
          actions.appendChild(button('Retry', 'ae-boot-shell__restart', function () { if (window.__aeMarkSelfReload) window.__aeMarkSelfReload(); window.location.reload(); }));
        } else {
          actions.appendChild(button('Retry', 'ae-boot-shell__retry', function () { if (window.__aeMarkSelfReload) window.__aeMarkSelfReload(); window.location.reload(); }));
        }
        shell.appendChild(message);
        shell.appendChild(actions);
      };
      // the game's code needs Chrome 80 or newer (vite build target); Android's WebView reports its version as Chrome/NN
      var ua = navigator.userAgent || '';
      var chrome = /Android/.test(ua) ? ua.match(/Chrome\/(\d+)/) : null;
      if (chrome && Number(chrome[1]) < 80) show('webview');
      // a script that failed to load reports on its element (capture), a code error reports here as well
      var errorTimer = 0;
      window.addEventListener('error', function (event) {
        var target = event && event.target;
        // an image or a sound that fails is not a start-up failure; a script, a stylesheet or a code error is
        if (target && target !== window && target.tagName && target.tagName !== 'SCRIPT' && target.tagName !== 'LINK') return;
        if (mounted() || errorTimer) return;
        errorTimer = window.setTimeout(function () { show('error'); }, 4000);
      }, true);
      window.setTimeout(function () { show('slow'); }, 25000);
    })();
  </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
